# Aspire HTTP Server Configuration File
# This file is optional. If not present, the server will auto-detect system capabilities.

# Server Settings
port=9080
backlog=100

# Performance Settings
# These will be auto-calculated based on system capabilities if not specified
# Uncomment and modify these values to override auto-detection
# buffer_size=4096
# max_events=100
# connection_timeout=30
# max_headers=50
# max_connections=1024
# max_pipeline=10
# num_processes=4

# Socket Buffer Settings (in bytes)
# socket_rcvbuf=1048576
# socket_sndbuf=1048576

# Epoll Settings (timeout in milliseconds)
# epoll_timeout=50

# Cleanup Settings (interval in seconds)
# cleanup_interval=10

# File Descriptor Limit
# fd_limit=4096

# System Override (optional - only use if auto-detection fails)
# cpu_cores=8
# total_memory_mb=8192 