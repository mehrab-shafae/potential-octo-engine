# Aspire HTTP Server Configuration File
# This file is optional. If not present, the server will auto-detect system capabilities.

# Server Settings
port=9080
backlog=100

# Performance Settings
# These will be auto-calculated based on system capabilities if not specified
# Uncomment and modify these values to override auto-detection
# buffer_size=4096
# max_events=100
# connection_timeout=30
# max_headers=50
# max_connections=1024
# max_pipeline=10
# num_processes=4

# Socket Buffer Settings (in bytes)
# socket_rcvbuf=1048576
# socket_sndbuf=1048576

# Epoll Settings (timeout in milliseconds)
# epoll_timeout=50

# Cleanup Settings (interval in seconds)
# cleanup_interval=10

# File Descriptor Limit
# fd_limit=4096

# Rate Limiting Settings
max_requests_per_window=1000    # Maximum requests per time window
rate_limit_window_seconds=60    # Time window in seconds
rate_limit_burst_size=100       # Burst allowance
rate_limit_block_on_exceed=false # Whether to block or throttle

# Slow-Down Settings
slow_down_window_ms=60000       # Time window in milliseconds
slow_down_delay_after=10        # Number of requests before delay starts
slow_down_delay_ms=100          # Initial delay in milliseconds
slow_down_max_delay_ms=5000     # Maximum delay in milliseconds
slow_down_delay_multiplier=1.0  # Multiplier for increasing delay
slow_down_skip_successful=false # Whether to skip successful requests
slow_down_skip_failed=false     # Whether to skip failed requests

# System Override (optional - only use if auto-detection fails)
# cpu_cores=8
# total_memory_mb=8192 